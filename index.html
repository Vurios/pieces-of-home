<!doctype html>
<html lang="en" data-stage="loading">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1d17" />
    <meta
      name="description"
      content="Pieces of Home. A cozy game for 1 to 4 players about the machines left on the Moon and Mars. Left behind. Still shining."
    />
    <title>Pieces of Home</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/kalam-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/kalam-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zilla-slab-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Fonts and page basics; the loading page itself is drawn further down. */
      @font-face {
        font-family: "Kalam";
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/kalam-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Kalam";
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/kalam-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Zilla Slab";
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/zilla-slab-latin-700-normal.woff2") format("woff2");
      }
      :root {
        --ink: #2b2622;
        --pencil: #5d5650;
        --paper: #f3e9d6;
        --clay: #b13f2c;
        --amber: #f2a541;
        --warm: #ffe2ae;
        --hand: "Kalam", "Segoe Print", "Bradley Hand", ui-rounded, sans-serif;
        --slab: "Zilla Slab", "Rockwell", "Roboto Slab", Georgia, serif;
        --sans: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #2a1d17;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /*
       * The loading page, painted before any JavaScript, in the game's own look:
       * the little home planet turning slowly under the night sky with Remi
       * walking on top, letter in hand; the Moon and Mars in the sky with letters
       * flying the dotted route out to them; the block-letter title. A paper card
       * ticks through things that kept working as the game loads, then asks to
       * turn on the light: the bulb in the title lights and its light fills the
       * screen and becomes Dad's lamp in the 3D workshop. Every layer is its own
       * element, so the browser moves each as one picture.
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--sans);
        background:
          radial-gradient(ellipse 58% 34% at 50% var(--top), rgba(255, 196, 128, 0.42), rgba(255, 170, 110, 0.12) 55%, transparent 75%),
          linear-gradient(180deg, #18173a 0%, #26245a 34%, #433669 62%, #6e4c72 82%, #8a5c74 100%);
        -webkit-user-select: none;
        user-select: none;
        /* Where the planet's top sits, and how big the planet is drawn. */
        --top: 64vh;
        --D: max(70vw, 80vh);
        /* Where the pointer is, from -1 to 1: near layers shift more than far ones. */
        --mx: 0;
        --my: 0;
        transition: opacity 1.2s ease;
      }
      #boot[data-state="leaving"] {
        opacity: 0;
        pointer-events: none;
      }
      #boot[data-state="gone"] {
        display: none;
      }
      #boot .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        margin: 0;
      }
      #boot .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #boot .far,
      #boot .letters,
      #boot .sparkles,
      #boot .stars,
      #boot .clouds,
      #boot .planet,
      #boot .shade,
      #boot .remi,
      #boot .fireflies,
      #boot .title {
        transition: translate 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #boot .stars,
      #boot .sparkles {
        translate: calc(var(--mx) * -4px) calc(var(--my) * -3px);
      }
      #boot .far,
      #boot .letters {
        translate: calc(var(--mx) * -10px) calc(var(--my) * -6px);
      }
      #boot .clouds {
        translate: calc(var(--mx) * -18px) calc(var(--my) * -8px);
      }
      #boot .planet,
      #boot .shade,
      #boot .remi {
        translate: calc(var(--mx) * -26px) calc(var(--my) * -10px);
      }
      #boot .fireflies {
        translate: calc(var(--mx) * -44px) calc(var(--my) * -16px);
      }
      #boot .title {
        translate: calc(var(--mx) * 8px) calc(var(--my) * 5px);
      }
      #boot .layer > svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- The sky: stars, the Moon and Mars, letters on their way ---------- */
      /*
       * Only small things move on their own (sparkles, letters, Remi, clouds,
       * fireflies) and the planet turns as one picture: big drawings never
       * repaint while the game loads behind them.
       */
      #boot .sparkles i {
        position: absolute;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        background: #fff6e0;
        clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
        animation: ld-sparkle 3.2s steps(16) var(--d) infinite;
      }
      #boot .far .route {
        fill: none;
        stroke: #fff6e0;
        stroke-width: 4;
        stroke-dasharray: 2 14;
        opacity: 0.4;
      }
      #boot .clouds div {
        position: absolute;
        opacity: 0.32;
        animation: ld-drift var(--t) steps(var(--n)) var(--d) infinite;
      }
      #boot .clouds svg {
        width: 100%;
        display: block;
      }

      /* ---------- The planet: it turns; the light on it does not ---------- */
      #boot .planet {
        /* The planet's middle sits 0.44 D under its top; the image is 1.6 D across, room for the balloon. */
        position: absolute;
        left: 50%;
        top: calc(var(--top) - var(--D) * 0.36);
        width: calc(var(--D) * 1.6);
        height: calc(var(--D) * 1.6);
        margin-left: calc(var(--D) * -0.8);
        pointer-events: none;
        animation: ld-turn 150s steps(1800) infinite;
        will-change: transform;
      }
      #boot .shade {
        position: absolute;
        left: 50%;
        top: calc(var(--top) - var(--D) * 0.06);
        width: var(--D);
        height: var(--D);
        margin-left: calc(var(--D) / -2);
        pointer-events: none;
      }
      #boot .shade {
        clip-path: circle(43.6% at 50% 50%);
        background:
          radial-gradient(circle at 64% 18%, rgba(255, 226, 174, 0.3), rgba(255, 226, 174, 0) 34%),
          radial-gradient(circle at 50% 50%, transparent 58%, rgba(24, 20, 50, 0.5) 92%);
      }

      /* ---------- Remi, walking on top with a letter ---------- */
      #boot .remi {
        position: absolute;
        left: 50%;
        width: calc(var(--D) * 0.112);
        margin-left: calc(var(--D) * -0.056);
        top: calc(var(--top) - var(--D) * 0.112 * 1.286 * 0.955);
      }
      #boot .remi svg {
        width: 100%;
        display: block;
        overflow: visible;
      }
      #boot .remi .body {
        animation: ld-step 0.42s steps(3) infinite alternate;
      }
      #boot .remi .leg,
      #boot .remi .arm {
        transform-box: fill-box;
        transform-origin: 50% 8%;
        animation: ld-swing 0.84s steps(6) infinite alternate;
      }
      #boot .remi .leg.back,
      #boot .remi .arm.front {
        animation-delay: -0.84s;
      }
      #boot .remi .arm.front {
        animation-name: ld-carry;
      }
      #boot .fireflies i {
        position: absolute;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background: radial-gradient(circle, #fff3cc 0 30%, rgba(255, 210, 120, 0.5) 45%, rgba(255, 210, 120, 0) 70%);
        opacity: 0;
        animation: ld-firefly var(--t) steps(var(--n)) var(--d) infinite;
      }

      /* ---------- The title: block letters, like the 3D title ---------- */
      #boot .title {
        position: absolute;
        left: 50%;
        top: 3.5vh;
        width: min(520px, 62vw, 52vh);
        transform: translateX(-50%);
        text-align: center;
      }
      #boot .title-art {
        width: 100%;
        display: block;
        overflow: visible;
      }
      #boot .title-art .blk {
        animation: ld-drop 0.75s cubic-bezier(0.25, 1.5, 0.45, 1) calc(0.2s + var(--i) * 0.07s) both;
      }
      #boot .title-art .back {
        fill: #9c6a43;
        stroke: var(--ink);
        stroke-width: 5.5;
        stroke-linejoin: round;
      }
      #boot .title-art .side {
        fill: #9c6a43;
      }
      #boot .title-art .face {
        stroke: var(--ink);
        stroke-width: 3.4;
        stroke-linejoin: round;
      }
      #boot .title-art .bulb-glass {
        fill: #f3e7cc;
        stroke: var(--ink);
        stroke-width: 3.4;
        stroke-linejoin: round;
        transition: fill 0.2s;
      }
      #boot .title-art .bulb-wire {
        fill: none;
        stroke: #8a6a3a;
        stroke-width: 2.4;
        stroke-linecap: round;
      }
      #boot .title-art .bulb-base {
        fill: #b9b4aa;
        stroke: var(--ink);
        stroke-width: 3;
        stroke-linejoin: round;
      }
      #boot .title-art .bulb-glow {
        opacity: 0.3;
      }
      #boot .kicker {
        margin: 0.4rem 0 0;
        color: #ffe2ae;
        font: 700 clamp(0.72rem, 1.1vw, 0.92rem) / 1.2 var(--slab);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0;
        animation: ld-fade 0.8s ease 1.4s forwards;
      }

      /* ---------- The card: what kept working, then the light ---------- */
      #boot .card {
        position: absolute;
        left: 50%;
        bottom: max(3.5vh, 16px);
        width: min(440px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 22px 26px 20px;
        background: #fbf6ec;
        border: 3px solid var(--ink);
        border-radius: 14px;
        box-shadow: 0 6px 0 var(--ink), 0 18px 40px rgba(12, 8, 30, 0.45);
        transform: translateX(-50%) rotate(-0.8deg);
        text-align: center;
        animation: ld-card 0.7s cubic-bezier(0.25, 1.4, 0.45, 1) 0.9s both;
      }
      #boot .card::before {
        /* The pin. */
        content: "";
        position: absolute;
        left: 50%;
        top: -11px;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        border-radius: 50%;
        background: #c0573e;
        border: 3px solid var(--ink);
        box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.18);
      }
      #boot .label {
        display: inline-block;
        margin: 0 0 10px;
        padding: 3px 10px;
        border: 2px solid #b8433a;
        border-radius: 4px;
        color: #b8433a;
        font: 700 0.74rem/1.2 var(--slab);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transform: rotate(-1.5deg);
      }
      #boot #kept {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        min-height: 2.2em;
      }
      #boot #kept li {
        grid-area: 1 / 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font: 700 1.2rem/1.25 var(--hand);
        color: var(--ink);
        opacity: 0;
        translate: 0 10px;
        transition:
          opacity 0.35s ease,
          translate 0.35s ease;
      }
      #boot #kept li.now {
        opacity: 1;
        translate: 0 0;
      }
      #boot #kept .tick {
        flex: none;
        width: 22px;
        height: 22px;
        border: 2.5px solid var(--ink);
        border-radius: 5px;
        background: #fffdf6;
        position: relative;
      }
      #boot #kept li.on .tick::after {
        content: "";
        position: absolute;
        left: 5px;
        top: -1px;
        width: 7px;
        height: 13px;
        border-right: 3.5px solid #b8433a;
        border-bottom: 3.5px solid #b8433a;
        transform: rotate(40deg);
      }
      #boot .meter {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }
      #boot .track {
        flex: 1;
        height: 14px;
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        background: #efe4cf;
        overflow: hidden;
      }
      #boot .track span {
        display: block;
        height: 100%;
        width: calc(var(--p, 0.02) * 100%);
        background: repeating-linear-gradient(-45deg, #f2a541 0 10px, #f7bd62 10px 20px);
        border-right: 2.5px solid var(--ink);
        transition: width 0.4s ease;
        animation: ld-stripes 0.8s steps(6) infinite;
      }
      #boot .pct {
        min-width: 3.2em;
        font: 700 1rem/1 var(--slab);
        color: var(--pencil);
        text-align: right;
      }
      #boot .slow {
        display: none;
        margin: 10px 0 0;
        color: var(--pencil);
        font-size: 0.9rem;
      }
      #boot[data-slow] .slow {
        display: block;
      }
      #boot .ready,
      #boot .nogl {
        display: none;
      }
      #boot[data-state="ready"] .loading,
      #boot[data-state="leaving"] .loading,
      #boot[data-state="nogl"] .loading {
        display: none;
      }
      #boot[data-state="ready"] .ready,
      #boot[data-state="leaving"] .ready {
        display: block;
        animation: ld-fade 0.4s ease both;
      }
      #boot[data-state="nogl"] .nogl {
        display: block;
      }
      #boot .line {
        margin: 0 0 14px;
        font: 400 1.12rem/1.35 var(--hand);
        color: var(--pencil);
      }
      #boot #light {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 26px 12px 18px;
        border: 3px solid var(--ink);
        border-radius: 14px;
        background: var(--amber);
        box-shadow: 0 5px 0 var(--ink);
        color: var(--ink);
        font: 700 1.55rem/1 var(--hand);
        cursor: pointer;
        opacity: 0.55;
        pointer-events: none;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          background 0.15s ease;
      }
      #boot[data-prompt] #light {
        opacity: 1;
        pointer-events: auto;
        animation: ld-invite 1.6s steps(8) infinite;
      }
      #boot #light:hover {
        background: #f7b555;
      }
      #boot #light:active,
      #boot[data-on] #light {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--ink);
        animation: none;
      }
      #boot #light:focus-visible {
        outline: 3px solid #fff6e0;
        outline-offset: 4px;
      }
      #boot #light .ico {
        width: 30px;
        height: 30px;
        flex: none;
      }
      #boot .hint {
        margin: 12px 0 0;
        color: var(--pencil);
        font-size: 0.9rem;
      }
      #boot .nogl p {
        margin: 0 0 12px;
        font: 400 1.1rem/1.4 var(--hand);
      }
      #boot .nogl a {
        color: #b8433a;
        font-weight: 700;
      }

      /* ---------- Turning on the light ---------- */
      #boot[data-on] .title-art .bulb-glass {
        fill: #fff2c6;
      }
      #boot[data-on] .title-art .bulb-glow {
        opacity: 1;
        animation: none;
      }
      #boot .flood {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at var(--bulb-x, 50%) var(--bulb-y, 30%), #fffaf0 0, #ffe2ae 18%, #f6b866 55%, #e99a4e 100%);
        clip-path: circle(0 at var(--bulb-x, 50%) var(--bulb-y, 30%));
        transition: clip-path 0.75s cubic-bezier(0.55, 0, 0.7, 0.4) 0.08s;
      }
      #boot[data-on] .flood {
        clip-path: circle(160vmax at var(--bulb-x, 50%) var(--bulb-y, 30%));
      }

      /* ---------- Smaller and taller screens ---------- */
      @media (max-aspect-ratio: 4/5) {
        #boot {
          --top: 63vh;
          --D: max(124vw, 66vh);
        }
        #boot .title {
          width: min(86vw, 420px);
          top: 6vh;
        }
      }
      @media (max-height: 560px) and (min-aspect-ratio: 4/5) {
        #boot {
          --top: 64vh;
        }
        #boot .title {
          width: min(330px, 52vh);
          top: 3vh;
        }
        #boot .card {
          padding: 14px 18px 12px;
        }
        #boot .line,
        #boot .hint {
          display: none;
        }
      }

      @keyframes ld-turn {
        to {
          transform: rotate(-360deg);
        }
      }
      @keyframes ld-sparkle {
        0%,
        100% {
          transform: scale(0.35);
          opacity: 0.3;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes ld-float {
        to {
          transform: translateY(-10px);
        }
      }
      @keyframes ld-drift {
        from {
          transform: translateX(-30vw);
        }
        to {
          transform: translateX(130vw);
        }
      }
      @keyframes ld-step {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-4px);
        }
      }
      @keyframes ld-swing {
        from {
          transform: rotate(24deg);
        }
        to {
          transform: rotate(-24deg);
        }
      }
      @keyframes ld-carry {
        from {
          transform: rotate(-6deg);
        }
        to {
          transform: rotate(-16deg);
        }
      }
      @keyframes ld-firefly {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        30% {
          opacity: 0.9;
        }
        70% {
          opacity: 0.6;
        }
        100% {
          transform: translate(18px, -140px);
          opacity: 0;
        }
      }
      @keyframes ld-drop {
        from {
          translate: 0 -46px;
          opacity: 0;
        }
        to {
          translate: 0 0;
          opacity: 1;
        }
      }
      @keyframes ld-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ld-card {
        from {
          translate: 0 60px;
          opacity: 0;
        }
        to {
          translate: 0 0;
          opacity: 1;
        }
      }
      @keyframes ld-stripes {
        to {
          background-position: 28px 0;
        }
      }
      @keyframes ld-invite {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }
      /*
       * With no graphics chip (the browser draws WebGL in software) every moving
       * layer costs the game time to load, so the loops hold still: the planet,
       * the clouds and the lights wait, and the title and card still come in.
       */
      #boot[data-lowpower] .planet,
      #boot[data-lowpower] .clouds div,
      #boot[data-lowpower] .fireflies i,
      #boot[data-lowpower] .sparkles i,
      #boot[data-lowpower] .remi .body,
      #boot[data-lowpower] .remi .leg,
      #boot[data-lowpower] .remi .arm,
      #boot[data-lowpower] .track span,
      #boot[data-lowpower] #light {
        animation-play-state: paused;
      }
      #boot[data-lowpower] .letters {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot *,
        #boot *::before,
        #boot *::after {
          animation: none !important;
          transition: none !important;
        }
        #boot .letters,
        #boot .fireflies {
          display: none;
        }
        #boot .kicker {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Pieces of Home game view"></canvas>

    <div id="boot" data-state="loading">
      <div class="layer stars" aria-hidden="true"><!--poh:stars--></div>
      <div class="layer sparkles" aria-hidden="true"><!--poh:sparkles--></div>
      <div class="layer far" aria-hidden="true"><!--poh:far--></div>
      <div class="layer letters" aria-hidden="true"><!--poh:letters--></div>
      <div class="layer clouds" aria-hidden="true">
        <div style="top: 14%; width: 15vw; --t: 95s; --n: 1140; --d: -20s"><!--poh:cloud1--></div>
        <div style="top: 36%; width: 11vw; --t: 120s; --n: 1440; --d: -75s"><!--poh:cloud2--></div>
        <div style="top: 48%; width: 19vw; --t: 80s; --n: 960; --d: -52s"><!--poh:cloud3--></div>
      </div>
      <!--poh:planet-->
      <div class="shade" aria-hidden="true"></div>
      <div class="remi" aria-hidden="true"><!--poh:remi--></div>
      <div class="layer fireflies" aria-hidden="true"><!--poh:fireflies--></div>

      <div class="title">
        <!--poh:title-->
        <p class="kicker"><!--poh:kicker--></p>
      </div>

      <div class="card">
        <div class="loading">
          <p class="label" id="kept-h"><!--poh:heading--></p>
          <ol id="kept" aria-labelledby="kept-h"><!--poh:list--></ol>
          <div class="meter" aria-hidden="true">
            <div class="track"><span></span></div>
            <span class="pct"><span id="pct">0</span>%</span>
          </div>
          <p class="slow"><!--poh:slow--></p>
        </div>
        <div class="ready">
          <p class="line"><!--poh:ready--></p>
          <button id="light" type="button">
            <svg class="ico" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 3 C 9 3, 6 8, 6 12 C 6 17, 11 19, 11 23 L 21 23 C 21 19, 26 17, 26 12 C 26 8, 23 3, 16 3 Z" fill="#fff2c6" stroke="#2b2622" stroke-width="2.4" stroke-linejoin="round" />
              <path d="M12 26 L 20 26 M13 29 L 19 29" stroke="#2b2622" stroke-width="2.4" stroke-linecap="round" />
              <path d="M13 17 C 14 13, 15 19, 16 15 C 17 11, 18 17, 19 14" fill="none" stroke="#b8433a" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span class="say"><!--poh:prompt--></span>
          </button>
          <p class="hint"><!--poh:hint--></p>
        </div>
        <div class="nogl" role="alert">
          <p><!--poh:nowebgl--></p>
          <a href="/field-guide/"><!--poh:nowebgl-link--></a>
        </div>
      </div>

      <div class="flood" aria-hidden="true"></div>
      <progress id="boot-progress" class="sr" max="100" value="0" aria-label="Loading">0%</progress>
      <p id="boot-live" class="sr" role="status" aria-live="polite"></p>
    </div>
    <div id="ui"></div>
    <noscript>
      <p style="position: fixed; inset: auto 0 16px; z-index: 60; text-align: center; font-size: 20px; color: #f7efe1">
        This game needs JavaScript. You can read the story in the <a href="/field-guide/" style="color: #ffe2ae">Field Guide</a>.
      </p>
    </noscript>
    <script>
      // The loader's controls, before the game's code arrives. main.ts drives these.
      (function () {
        var boot = document.getElementById("boot");
        var bar = document.getElementById("boot-progress");
        var live = document.getElementById("boot-live");
        var pct = document.getElementById("pct");
        var light = document.getElementById("light");
        var fill = boot.querySelector(".track span");
        var items = boot.querySelectorAll("#kept li");
        var words = /*poh:milestones*/;
        var value = 0;
        var waiting = null;
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (items[0]) items[0].classList.add("now");
        // Software WebGL means no graphics chip: hold the page's loops still so the game loads sooner.
        try {
          var gl = document.createElement("canvas").getContext("webgl");
          var info = gl && gl.getExtension("WEBGL_debug_renderer_info");
          var name = info ? String(gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) : "";
          if (/swiftshader|llvmpipe|softpipe|software|basic render/i.test(name)) boot.dataset.lowpower = "";
          var lose = gl && gl.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
        } catch (e) {}
        function set(p) {
          value = Math.max(value, Math.min(1, p || 0));
          var n = Math.round(value * 100);
          bar.value = n;
          bar.textContent = n + "%";
          pct.textContent = n;
          fill.style.setProperty("--p", value.toFixed(3));
        }
        function milestone(i) {
          if (!items[i]) return;
          for (var k = 0; k < items.length; k++) items[k].classList.toggle("now", k === i);
          items[i].classList.add("on");
          if (words[i]) live.textContent = words[i];
        }
        function place() {
          // The light opens from the bulb in the title, wherever it sits.
          var glass = boot.querySelector(".title-art .bulb-glass");
          if (!glass) return;
          var box = glass.getBoundingClientRect();
          boot.style.setProperty("--bulb-x", box.left + box.width / 2 + "px");
          boot.style.setProperty("--bulb-y", box.top + box.height * 0.45 + "px");
        }
        // Any gamepad button turns on the light too.
        function pollPad() {
          if (!waiting) return;
          var pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (var i = 0; i < pads.length; i++) {
            var p = pads[i];
            if (!p || !p.connected) continue;
            for (var j = 0; j < p.buttons.length; j++) if (p.buttons[j].pressed) return go(null);
          }
          setTimeout(pollPad, 40);
        }
        function go(event) {
          if (!waiting) return;
          if (event && event.type === "keydown") {
            var k = event.key;
            if (k === "Tab" || k === "Shift" || k === "Control" || k === "Alt" || k === "Meta") return;
          }
          var cb = waiting;
          waiting = null;
          if (event) event.preventDefault();
          place();
          // The button presses, the bulb lights, then its light becomes the world.
          boot.dataset.on = "";
          setTimeout(cb, reduce ? 80 : 820);
        }
        function ready(cb) {
          set(1);
          for (var i = 0; i < items.length; i++) items[i].classList.add("on");
          milestone(items.length - 1);
          boot.dataset.state = "ready";
          live.textContent = light.querySelector(".say").textContent.trim();
          setTimeout(function () {
            boot.dataset.prompt = "";
            waiting = cb;
            light.focus({ preventScroll: true });
            pollPad();
          }, reduce ? 200 : 700);
        }
        boot.addEventListener("pointerup", go);
        // The layers lean with the pointer, near ones more than far ones.
        if (!reduce)
          window.addEventListener("pointermove", function (e) {
            boot.style.setProperty("--mx", ((e.clientX / window.innerWidth) * 2 - 1).toFixed(3));
            boot.style.setProperty("--my", ((e.clientY / window.innerHeight) * 2 - 1).toFixed(3));
          });
        window.addEventListener("keydown", go);
        window.addEventListener("resize", place);
        light.addEventListener("click", function (e) {
          e.stopPropagation();
          go(e);
        });
        setTimeout(function () {
          if (boot.dataset.state === "loading") boot.dataset.slow = "";
        }, 8000);
        window.__pohBoot = {
          progress: set,
          milestone: milestone,
          ready: ready,
          fail: function () {
            boot.dataset.state = "nogl";
          },
          leave: function () {
            boot.dataset.state = "leaving";
            setTimeout(function () {
              boot.dataset.state = "gone";
            }, 1300);
          },
          hide: function () {
            boot.dataset.state = "gone";
          },
        };
        set(0.02);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
